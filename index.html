<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}</style></head><body>
<title>Result Sales Força de Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Josefin+Sans:wght@300;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral azul-marinho (marca) com as 7 áreas do processo; conteúdo à direita; fichas de empresa e de oportunidade abrem num painel lateral; formulários abrem numa janela por cima. No celular, a barra vira topo com abas roláveis. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#EBEFF6; --ink:#101830; --muted:#4D5670; --line:#D8DFEA;
  --brand:#211C42; --accent:#211C42; --accent-ink:#FFFFFF; --accent-soft:#E7E6F3; --link:#2F6FAE;
  --side:#211C42; --side-ink:#ECEBF7; --side-mut:#A7A4C8; --side-act:#3A3570; --side-line:#363162;
  --warn:#965800; --warn-soft:#FBEED6; --bad:#B42318; --bad-soft:#FBE3DF; --ok:#1D7536; --ok-soft:#DFF2E4; --info:#2F6FAE; --info-soft:#E2ECF8;
  --st-diag:#2F6FAE; --st-prop:#5B4FC9; --st-neg:#B86A00; --st-fech:#1D7536;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-brand:"Josefin Sans","Century Gothic","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F1E; --surface:#161933; --sunk:#1F2342; --ink:#E9EBF5; --muted:#9EA5BF; --line:#2B3055;
  --brand:#E9EBF5; --accent:#9DBDF0; --accent-ink:#0D0F1E; --accent-soft:#252B52; --link:#8DB6EE;
  --side:#11132A; --side-ink:#E9EBF5; --side-mut:#8F95B4; --side-act:#262B55; --side-line:#23284A;
  --warn:#F0B44C; --warn-soft:#3A2B11; --bad:#FF8B7B; --bad-soft:#3E1A16; --ok:#6FD38E; --ok-soft:#163220; --info:#8DB6EE; --info-soft:#1C2850;
  --st-diag:#7FB0EE; --st-prop:#A99FFF; --st-neg:#F0B44C; --st-fech:#6FD38E;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D0F1E; --surface:#161933; --sunk:#1F2342; --ink:#E9EBF5; --muted:#9EA5BF; --line:#2B3055;
  --brand:#E9EBF5; --accent:#9DBDF0; --accent-ink:#0D0F1E; --accent-soft:#252B52; --link:#8DB6EE;
  --side:#11132A; --side-ink:#E9EBF5; --side-mut:#8F95B4; --side-act:#262B55; --side-line:#23284A;
  --warn:#F0B44C; --warn-soft:#3A2B11; --bad:#FF8B7B; --bad-soft:#3E1A16; --ok:#6FD38E; --ok-soft:#163220; --info:#8DB6EE; --info-soft:#1C2850;
  --st-diag:#7FB0EE; --st-prop:#A99FFF; --st-neg:#F0B44C; --st-fech:#6FD38E;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.55rem} h3{font-size:1.08rem} h4{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.mut{color:var(--muted)} .sm{font-size:.84rem} .xs{font-size:.76rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
:focus-visible{outline:2.5px solid var(--link);outline-offset:2px}

/* estrutura */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;color:var(--side-ink);padding:0 6px}
.brand svg{width:34px;height:34px;flex:none}
.wm{display:flex;flex-direction:column;gap:3px;line-height:1}
.wm b{font-family:var(--f-brand);font-weight:600;font-size:1.02rem;letter-spacing:.22em}
.wm span{font-family:var(--f-brand);font-weight:300;font-size:1.02rem;letter-spacing:.22em}
.brand-sub{font-size:.72rem;color:var(--side-mut);padding:0 6px;margin-top:-10px;letter-spacing:.04em}
.whoami{display:flex;flex-direction:column;gap:4px;padding:0 6px}
.whoami label{font-size:.7rem;color:var(--side-mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.whoami select{background:var(--side-act);border:1px solid var(--side-line);color:var(--side-ink);border-radius:8px;padding:7px 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-ink);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:600;opacity:.86}
.nav button:hover{background:var(--side-act);opacity:1}
.nav button[aria-current="page"]{background:var(--side-act);opacity:1;box-shadow:inset 3px 0 0 var(--side-ink)}
.nav svg{width:18px;height:18px;flex:none}
.nav .lbl{flex:1}
.nav .stg{font-family:var(--f-num);font-size:.68rem;color:var(--side-mut);font-weight:500}
.nav .cnt{background:var(--side-ink);color:var(--side);font-size:.7rem;padding:0 7px;border-radius:99px;font-weight:700}
.side-foot{margin-top:auto;font-size:.74rem;color:var(--side-mut);padding:0 6px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.local{background:var(--warn)}
main{min-width:0;padding:26px 30px 60px;max-width:1320px;width:100%}
.vhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.vhead .t{margin-right:auto;display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.grid-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;gap:10px;padding:12px 16px}
  .brand-sub,.side-foot{display:none}
  .side-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .whoami{flex-direction:row;align-items:center;margin-left:auto;padding:0}
  .whoami label{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -6px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;padding:8px 10px}
  .nav .stg{display:none}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--side-ink)}
  main{padding:18px 16px 60px}
  .grid2{grid-template-columns:1fr}
}
.side-top{display:flex;flex-direction:column;gap:18px}

/* peças */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flush{padding:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{margin-right:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ghost{background:none;border-color:transparent;color:var(--link);padding:6px 8px}
.btn.ghost:hover{background:var(--sunk)}
.btn.ai{border-color:var(--st-prop);color:var(--st-prop)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--ink);font-weight:700;cursor:pointer;text-align:left}
.lnk:hover{color:var(--link);text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--brand)}
.tier{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-family:var(--f-num);font-size:.75rem;font-weight:500;flex:none}
.tier.A{background:var(--ok-soft);color:var(--ok)} .tier.B{background:var(--info-soft);color:var(--info)} .tier.C{background:var(--sunk);color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:.74rem;padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.chip.sig{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;padding:34px 18px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.subtabs button{background:none;border:0;padding:8px 12px 10px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2.5px solid transparent;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)}

/* tabela */
.tw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--sunk)}
.tbl .r{text-align:right}

/* filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select,.fld input,.fld select,.fld textarea,.inl{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.84rem;min-width:0}
.fld>span{font-weight:600;color:var(--muted);font-size:.78rem}
.fld textarea{resize:vertical;min-height:64px;line-height:1.45}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;cursor:pointer}
.check input{margin-top:3px}

/* meu dia */
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.act{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:11px 14px}
.act.bad{border-left-color:var(--bad)} .act.warn{border-left-color:var(--warn)} .act.info{border-left-color:var(--info)} .act.ok{border-left-color:var(--ok)}
.act-main{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:2px}
.act-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act-btns{display:flex;gap:6px;flex-wrap:wrap}
.meta-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.meta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.meta b{font-family:var(--f-num);font-weight:500;font-size:1.25rem;font-variant-numeric:tabular-nums}
.meta .mut{font-size:.8rem}

/* kpi */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:3px}
.kpi .v{font-family:var(--f-num);font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--muted);font-weight:600}
.kpi .s{font-size:.76rem;color:var(--muted)}

/* funil */
.funnel{display:flex;flex-direction:column;gap:6px}
.fr{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.86rem}
.fr .fb{height:22px;background:var(--sunk);border-radius:5px;overflow:hidden}
.fr .fb i{display:block;height:100%;background:var(--accent);border-radius:5px;min-width:2px}
.fr .fb i.bad{background:var(--bad)}
.fr .cv{font-size:.74rem;color:var(--muted);text-align:right}
@media (max-width:560px){.fr{grid-template-columns:110px minmax(0,1fr) 52px}}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col-h{display:flex;flex-direction:column;gap:2px;padding:2px 4px 6px;border-bottom:3px solid var(--line)}
.col-h b{font-family:var(--f-display);font-size:.98rem}
.col[data-s=diagnostico] .col-h{border-color:var(--st-diag)} .col[data-s=proposta] .col-h{border-color:var(--st-prop)}
.col[data-s=negociacao] .col-h{border-color:var(--st-neg)} .col[data-s=fechamento] .col-h{border-color:var(--st-fech)}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.ocard:hover{border-color:var(--muted)}
.ocard .ov{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.ocard .mv{display:flex;gap:4px;justify-content:flex-end}

/* painel lateral */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
.dr-h{display:flex;gap:12px;align-items:flex-start;padding:16px 18px 12px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.dr-h .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dr-b{flex:1;overflow-y:auto;padding:16px 18px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.x{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1.1rem;flex:none}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec>h4{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec>h4 .row{margin-left:auto}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.next{background:var(--accent-soft);border:1px solid transparent;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem}
.tl li:first-child{border-top:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.86rem}
.steps li{display:grid;grid-template-columns:46px 92px minmax(0,1fr);gap:8px;padding:4px 6px;border-radius:6px}
.steps li.cur{background:var(--warn-soft)}
.steps li.done{color:var(--muted);text-decoration:line-through}
.ring{--p:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-num);font-size:.86rem}
.aibox{border:1px dashed var(--st-prop);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;font-size:.9rem;white-space:pre-wrap}
.aibox .lab{color:var(--st-prop);font-weight:700;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;white-space:normal}

/* janela de formulário */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,12,30,.5)}
.sheet{background:var(--surface);border-radius:12px;width:min(620px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sh-h h3{flex:1}
.sh-b{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sh-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:minmax(0,2fr) 64px 110px 70px 32px;gap:6px;align-items:center}
.item input,.item select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 7px;min-width:0;width:100%}
@media (max-width:560px){.item{grid-template-columns:1fr 1fr;}.item select{grid-column:1/-1}}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:8px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:70;font-weight:600;max-width:calc(100% - 32px)}
.savebar{position:sticky;bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;margin-top:14px;flex-wrap:wrap;z-index:5}
.savebar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
details.card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h3{margin-right:auto}
details.card>summary::after{content:"+";font-family:var(--f-num);color:var(--muted)}
details.card[open]>summary::after{content:"–"}
details.card[open]>summary{margin-bottom:14px}
.ledit{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.journey{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;list-style:none;margin:0;padding:0;counter-reset:j}
.journey li button{width:100%;display:flex;gap:8px;align-items:baseline;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.84rem}
.journey li button:hover{border-color:var(--muted)}
.journey .n{font-family:var(--f-num);color:var(--muted);font-size:.74rem;min-width:18px}
.cols-bars{display:flex;gap:14px;align-items:flex-end;height:150px;padding-top:10px}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.74rem;color:var(--muted)}
.cb .stk{width:100%;max-width:64px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.cb .stk i{display:block;width:100%;border-radius:4px 4px 0 0}

const chains=new Map();
function enfileira(path,fn){const p=(chains.get(path)||Promise.resolve()).then(fn);chains.set(path,p.catch(()=>{}));return p}
function werr(e){
  console.error(e);
  const c=e&&e.code;
  if(c==='invalid_argument'){S.canWrite=false;toast('Você não tem permissão para alterar estes dados. Peça ao dono do app acesso de Colaborador.')}
  else if(c==='quota_exceeded')toast('O banco do app atingiu o limite. Remova registros antigos ou de exemplo.');
  else if(c==='resource_exhausted')toast('Muitas gravações seguidas. Espere alguns segundos e tente de novo.');
  else toast('Não consegui salvar agora. Tente de novo em instantes.');
}
async function put(kind,id,data){
  if(db)return enfileira(COL[kind]+'/'+id,()=>db.collection(COL[kind]).doc(id).set(data)).catch(werr);
  S[kind].set(id,{...cl(data),id});saveLocal();render();
}
async function patch(kind,id,data){
  if(db)return enfileira(COL[kind]+'/'+id,()=>db.collection(COL[kind]).doc(id).update(data)).catch(werr);
  const cur=S[kind].get(id);if(!cur)return;S[kind].set(id,merge(cl(cur),cl(data)));saveLocal();render();
}
async function remove(kind,id){
  if(db)return enfileira(COL[kind]+'/'+id,()=>db.collection(COL[kind]).doc(id).delete()).catch(werr);

  return d;

function icp(e){
  const I=cfg().icp||{};const parts=[];let s=0,max=0;
  const crit=(label,peso,ativo,ok)=>{if(!ativo)return;max+=peso;if(ok)s+=peso;parts.push([label,ok,peso])};
  const segs=csv(I.segmentos).map(norm), es=norm(e.segmento);
  crit('Segmento',25,segs.length,es&&segs.some(x=>es.includes(x)||x.includes(es)));
  crit('Porte',20,(I.portes||[]).length,(I.portes||[]).includes(e.porte));
  const regs=csv(I.regioes).map(norm);
  crit('Região',15,regs.length,regs.includes(norm(e.uf))||regs.includes(norm(e.cidade)));
  crit('Faturamento',10,+I.fatMin>0,+e.faturamento>=+I.fatMin);
  crit('Funcionários',5,+I.funcMin>0,+e.funcionarios>=+I.funcMin);
  const techs=csv(I.tecnologias).map(norm), et=csv(e.tecnologias).map(norm);
  crit('Tecnologias',10,techs.length,et.some(t=>techs.includes(t)));
  const ns=(e.sinais||[]).length;max+=15;s+=Math.min(15,ns*5);parts.push(['Sinais de oportunidade ('+ns+')',ns>0,15]);
  const score=max?Math.round(s/max*100):0;
  return {score,tier:score>=75?'A':score>=50?'B':'C',parts};
}
const tierTag=e=>{const i=icp(e);return `<span class="tier ${i.tier}" title="Aderência ao ICP: ${i.score}">${i.tier}</span>`};
function cadInfo(e){
  if(!e.cadencia)return null;
  const cad=(cfg().cadencias||[]).find(c=>c.id===e.cadencia.id);if(!cad)return null;
  const i=e.cadencia.passo||0, step=cad.passos[i];
  if(!step)return {cad,fim:true,i,total:cad.passos.length};
  return {cad,step,i,due:addDays(e.cadencia.inicio,step.dia),total:cad.passos.length};
}
function qualScore(resp,fw){const qs=FRAMEWORKS[fw]||FRAMEWORKS.BANT;const t=sum(qs,q=>+(resp||{})[q.k]||0);return Math.round(t/(qs.length*2)*100)}
const pill=(txt,cls)=>`<span class="pill ${cls||''}">${esc(txt)}</span>`;
const stPill=s=>{const x=STATUS[s]||[s||'—','neutral'];return pill(x[0],x[1])};
const opt=(list,sel)=>list.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${String(v)===String(sel??'')?' selected':''}>${esc(l)}</option>`}).join('');

/* ============ distribuição ============ */
function cargaAtual(){const c={};for(const e of S.emp.values())if(e.dono&&!['cliente','descartado','perdido','churn'].includes(e.status))c[e.dono]=(c[e.dono]||0)+1;return c}
function escolherDono(e,carga){
  const C=cfg();
  for(const r of C.regras||[]){
    if(!r.para||!r.valor||!membro(r.para))continue;const v=norm(r.valor);
    const campos=r.campo==='regiao'?[e.uf,e.cidade]:r.campo==='segmento'?[e.segmento]:r.campo==='porte'?[e.porte]:r.campo==='produto'?[(C.produtos||[]).find(p=>p.id===e.produtoInteresse)?.nome]:r.campo==='tier'?[icp(e).tier]:[];
    if(campos.some(x=>x&&(norm(x)===v||(v.length>2&&norm(x).includes(v))))){carga[r.para]=(carga[r.para]||0)+1;return r.para}
  }
  for(const t of C.territorios||[]){
    if(t.dono&&membro(t.dono)&&csv(t.regioes).map(norm).some(x=>x===norm(e.uf)||x===norm(e.cidade))){carga[t.dono]=(carga[t.dono]||0)+1;return t.dono}
  }
  const sdrs=equipe().filter(m=>m.papel==='SDR');const pool=sdrs.length?sdrs:equipe().filter(m=>m.papel!=='Gestor');
  if(!pool.length)return '';
  const p=[...pool].sort((a,b)=>(carga[a.id]||0)-(carga[b.id]||0))[0];carga[p.id]=(carga[p.id]||0)+1;return p.id;
}
async function distribuir(ids){
  if(!equipe().length){toast('Cadastre a equipe em Estratégia antes de distribuir.');return}
  const carga=cargaAtual();let n=0;
  for(const id of ids){const e=S.emp.get(id);if(!e||e.dono)continue;const d=escolherDono(e,carga);if(d){await patch('emp',id,{dono:d});n++}}
  toast(n?n+' lead(s) distribuído(s) pelas regras':'Nenhum lead sem dono para distribuir');
}

/* ============ métricas (gestão) ============ */
function periodo(k){
  const t=hoje(),d=new Date();
  if(k==='mes')return [ymd(new Date(d.getFullYear(),d.getMonth(),1)),t];
  if(k==='mespassado')return [ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))];
  if(k==='90d')return [addDays(t,-89),t];
  if(k==='ano')return [d.getFullYear()+'-01-01',t];
  return ['2000-01-01',t];
}
const inPer=(s,p)=>!!s&&s.slice(0,10)>=p[0]&&s.slice(0,10)<=p[1];
function metricas(p,who){
  const mine=r=>who==='all'||r.dono===who;
  const atv=[...S.atv.values()].filter(mine);
  const tent=atv.filter(a=>CANAIS[a.tipo]&&inPer(a.data,p));
  const efet=tent.filter(a=>a.resultado==='contato'||a.resultado==='agendou');
  const trab=new Set(tent.map(a=>a.empresaId)).size;
  const qual=[...S.emp.values()].filter(e=>mine(e)&&e.qualif&&inPer(e.qualif.data,p)&&e.qualif.score>=cfg().minScore).length;
  const reu=atv.filter(a=>a.tipo==='reuniao');
  const agend=reu.filter(a=>inPer(a.criadoEm||a.data,p)).length;
  const realiz=reu.filter(a=>a.status==='realizada'&&inPer(a.data,p)).length;
  const noshow=reu.filter(a=>a.status==='noshow'&&inPer(a.data,p)).length;
  const opps=[...S.opp.values()].filter(mine);
  const oppN=opps.filter(o=>inPer(o.criadoEm,p)).length;
  const prop=opps.filter(o=>(o.propostas||[]).some(v=>inPer(v.enviadaEm,p))).length;
  const ganhas=opps.filter(o=>o.status==='ganha'&&inPer(o.fechamento?.data,p));
  const perdidas=opps.filter(o=>o.status==='perdida'&&inPer(o.fechamento?.data,p));
  const receita=sum(ganhas,o=>o.fechamento.valorFinal);
  const ciclo=avg(ganhas.map(o=>diffDays(o.criadoEm,o.fechamento.data)));
  const meses=Math.max(1,Math.round((diffDays(p[0],p[1])+1)/30));
  const cust=+cfg().custoComercialMensal||0;
  const cac=who==='all'&&cust&&ganhas.length?cust*meses/ganhas.length:null;
  return {tent:tent.length,efet:efet.length,trab,qual,agend,realiz,noshow,oppN,prop,vendas:ganhas.length,perdidas,ganhas,receita,ticket:ganhas.length?receita/ganhas.length:0,ciclo,cac,meses};
}
function metaDe(who,meses){
  const ms=who==='all'?equipe():equipe().filter(m=>m.id===who);
  return {reunioes:sum(ms,m=>m.metaReunioes)*meses,vendas:sum(ms,m=>m.metaVendas)*meses,receita:sum(ms,m=>m.metaReceita)*meses};
}

function acoes(){
  const t=hoje(),amanha=addDays(t,1),C=cfg(),out=[];

      }

    }

  }
  const novos=[];

    if(['novo','prospeccao'].includes(e.status)){
      if(ci&&ci.fim)add({pri:5,cls:'info',cat:'Cadência encerrada',e,txt:`Terminou a "${ci.cad.nome}" sem conversa. Recomece com outro canal ou descarte.`,btns:[b('Nova cadência','cadForm',e.id,'','pri'),b('Descartar','descartar',e.id)],ord:'9'});
      else if(ci&&ci.due<=t){
        const c=contatoPrincipal(e);

          sub:c?[c.nome,c.cargo,ci.step.canal==='email'?c.email:ci.step.canal==='linkedin'?c.linkedin:c.tel].filter(Boolean).join(' · '):'Sem contato cadastrado',
          btns:[b('Registrar tentativa','logForm',e.id,ci.step.canal,'pri'),b('Escrever (IA)','aiMsg',e.id,ci.step.canal),b('Pular passo','cadSkip',e.id)],ord:ci.due});

    if(e.status==='reuniao'&&!empOpps(e.id).length&&empAtvs(e.id).some(a=>a.tipo==='reuniao'&&a.status==='realizada'))add({pri:2,cls:'warn',cat:'Diagnóstico',e,txt:'A reunião aconteceu. Registre dores, decisores e orçamento e abra a oportunidade.',btns:[b('Registrar diagnóstico','oppForm',e.id,'','pri')],ord:'3'});
    if(e.status==='cliente'&&e.cliente){

      if(k.renovacao&&diffDays(t,k.renovacao)<=60&&diffDays(t,k.renovacao)>=-30&&!empOpps(e.id).some(o=>o.tipo==='renovacao'&&o.status==='aberta'))add({pri:4,cls:'warn',cat:'Renovação',e,txt:`Contrato renova ${rel(k.renovacao)} (${fdate(k.renovacao)}). Abra a renovação com antecedência.`,btns:[b('Abrir renovação','oppForm',e.id,'renovacao','pri'),b('Registrar contato','logForm',e.id,'ligacao')],ord:k.renovacao});
      if(k.saude==='vermelho')add({pri:3,cls:'bad',cat:'Cliente em risco',e,txt:'Saúde marcada como "em risco". Fale com o cliente antes que vire churn.',btns:[b('Registrar contato','logForm',e.id,'ligacao','pri'),b('Plano (IA)','aiEmp',e.id)],ord:'2'});
      const ut=ultimoToque(e.id);if(!ut||diffDays(ut,t)>30)add({pri:6,cls:'info',cat:'Relacionamento',e,txt:'Mais de 30 dias sem contato com este cliente. Boa hora para checar resultados e abrir upsell.',btns:[b('Registrar contato','logForm',e.id,'whatsapp','pri'),b('Upsell','oppForm',e.id,'upsell')],ord:'8'});

  for(const o of S.opp.values()){

    else if(parada>=(+cfg().diasParada||7))add({pri:3,cls:'bad',cat:'Oportunidade parada',e,txt:`${o.titulo||'Oportunidade'} · ${ETAPA_NOME[o.etapa]} · ${parada} dias sem movimento · ${money(o.valor)}`,btns:[b('Abrir','opp',o.id,'','pri'),b('Plano de retomada (IA)','aiOpp',o.id)],ord:ut});

  }
  for(const o of S.opp.values()){
    if(o.status!=='ganha'||!o.handoff||o.handoff.status==='concluido')continue;
    if(!(S.me==='all'||o.dono===S.me||o.handoff.responsavel===S.me))continue;
    const e=S.emp.get(o.empresaId);if(!e)continue;const ck=o.handoff.checklist||[];
    add({pri:4,cls:'ok',cat:'Implantação',e,txt:`Passagem para operação: ${ck.filter(x=>x.ok).length} de ${ck.length} itens feitos.`,btns:[b('Abrir checklist','opp',o.id,'implantacao','pri')],ord:o.fechamento?.data||''});
  }
  return out.sort((a,b)=>a.pri-b.pri||String(a.ord).localeCompare(String(b.ord)));

function aiBox(key){

  return `<div class="aibox"><span class="lab">Sugestão da IA · confira antes de usar</span>${o.html||esc(o.text)}</div>`;
}

function setPath(o,path,v){const ks=path.split('.');let c=o;for(let i=0;i<ks.length-1;i++){const k=ks[i];if(c[k]==null)c[k]=/^\d+$/.test(ks[i+1])?[]:{};c=c[k]}c[ks[ks.length-1]]=v}
function getPath(o,path){return path.split('.').reduce((c,k)=>c==null?c:c[k],o)}

function filtraEmp(){
  const F=S.f.merc,q=norm(F.q);
  return [...S.emp.values()].filter(e=>{
    if(F.status==='abertos'){if(['cliente','descartado','perdido','churn'].includes(e.status))return false}else if(F.status&&e.status!==F.status)return false;
    if(F.seg&&norm(e.segmento)!==norm(F.seg))return false;
    if(F.porte&&e.porte!==F.porte)return false;
    if(F.uf&&norm(e.uf)!==norm(F.uf))return false;
    if(F.dono==='_sem'){if(e.dono)return false}else if(F.dono==='_meu'){if(e.dono!==S.me)return false}else if(F.dono&&e.dono!==F.dono)return false;
    if(F.tier&&icp(e).tier!==F.tier)return false;
    if(q&&!norm([e.nome,e.cnpj,e.cidade,e.segmento,...(e.contatos||[]).map(c=>c.nome)].join(' ')).includes(q))return false;
    return true;
  }).map(e=>({e,i:icp(e)})).sort((a,b)=>b.i.score-a.i.score||a.e.nome.localeCompare(b.e.nome));
}
function proximoPassoTxt(e){
  const ci=cadInfo(e);
  if(ci&&!ci.fim)return CANAIS[ci.step.canal]+' '+rel(ci.due);
  if(ci&&ci.fim)return 'Cadência encerrada';
  const r=empAtvs(e.id).find(a=>a.tipo==='reuniao'&&['agendada','confirmada'].includes(a.status));
  if(r)return 'Reunião '+fdt(r.data);
  if(e.status==='novo')return 'Iniciar cadência';
  if(e.status==='prospeccao')return 'Qualificar';
  if(e.status==='qualificado')return 'Agendar reunião';
  return '—';
}

/* ============ visão: Gestão (etapa 15) ============ */
function vGestao(){

  const mx=Math.max(1,...fun.map(f=>f[1]));
  const taxas=[['Taxa de contato','contatos efetivos ÷ tentativas',pct(m.efet,m.tent)],['Conversão em reunião','agendadas ÷ contatos efetivos',pct(m.agend,m.efet)],['Show rate','realizadas ÷ (realizadas + no-show)',pct(m.realiz,m.realiz+m.noshow)],['Reunião → oportunidade','oportunidades ÷ realizadas',pct(m.oppN,m.realiz)],['Oportunidade → proposta','propostas ÷ oportunidades',pct(m.prop,m.oppN)],['Proposta → venda','vendas ÷ propostas',pct(m.vendas,m.prop)],['Win rate','ganhas ÷ (ganhas + perdidas)',pct(m.vendas,m.vendas+m.perdidas.length)]];
  const abertas=[...S.opp.values()].filter(o=>o.status==='aberta'&&(who==='all'||o.dono===who));

  const fmx=Math.max(1,...meses.map(x=>x.t));

  const motL=Object.entries(mot).sort((a,b)=>b[1]-a[1]);const mmx=Math.max(1,...motL.map(x=>x[1]));
  const prod=equipe().map(x=>({x,mt:metricas(p,x.id),meta:metaDe(x.id,m.meses)}));
  const ating=meta.receita?Math.round(m.receita/meta.receita*100):null;
  return `<div class="vhead"><div class="t"><span class="eyebrow">Etapa 15</span><h2>Gestão comercial</h2><p class="mut">Funil completo, conversões, produtividade, forecast e atingimento de meta, calculados a partir do que o time registra.</p></div>
    <select class="inl" id="fg-per" data-f="gest.per">${opt([['mes','Este mês'],['mespassado','Mês passado'],['90d','Últimos 90 dias'],['ano','Este ano'],['tudo','Tudo']],G.per)}</select>
    ${S.me==='all'?`<select class="inl" id="fg-who" data-f="gest.who"><option value="all">Toda a equipe</option>${opt(equipe().map(x=>[x.id,x.nome]),G.who)}</select>`:''}
    ${S.ai?'<button class="btn ai" data-a="aiGestao">Análise da IA</button>':''}</div>
  ${aiBox('gestao')}
  <div class="grid-k" style="margin:14px 0">
    <div class="kpi"><span class="l">Receita fechada</span><span class="v">${money(m.receita)}</span><span class="s">${ating!=null?ating+'% da meta de '+money(meta.receita):'Sem meta de receita'}</span>${ating!=null?`<div class="bar ${ating>=100?'ok':''}"><i style="width:${Math.min(100,ating)}%"></i></div>`:''}</div>
    <div class="kpi"><span class="l">Vendas</span><span class="v">${nf(m.vendas)}</span><span class="s">${meta.vendas?'Meta '+nf(meta.vendas):'—'}</span></div>
    <div class="kpi"><span class="l">Ticket médio</span><span class="v">${money(m.ticket)}</span></div>
    <div class="kpi"><span class="l">Ciclo de venda</span><span class="v">${m.ciclo!=null?Math.round(m.ciclo)+' dias':'—'}</span><span class="s">da oportunidade ao fechamento</span></div>
    <div class="kpi"><span class="l">CAC comercial</span><span class="v">${m.cac!=null?money(m.cac):'—'}</span><span class="s">${who!=='all'?'só na visão da equipe':+cfg().custoComercialMensal?'custo do período ÷ vendas':'informe o custo em Estratégia'}</span></div>
    <div class="kpi"><span class="l">Forecast ponderado</span><span class="v">${money(sum(abertas,o=>(+o.valor||0)*(+o.prob||0)/100))}</span><span class="s">${money(sum(abertas,o=>o.valor))} em aberto</span></div>
  </div>
  <div class="grid2"><div class="card"><div class="card-h"><h3>Funil do período</h3><span class="sm mut">${fdate(p[0])} a ${fdate(p[1])}</span></div>
      <div class="funnel">${fun.map(([l,v,c],i)=>`<div class="fr"><span class="sm">${l}</span><div class="fb"><i class="${c||''}" style="width:${v/mx*100}%"></i></div><span class="num sm" style="text-align:right">${nf(v)}</span></div>`).join('')}</div></div>

/* gráficos por vendedor: uma medida por gráfico, mesma escala dentro de cada gráfico */
function hbar(titulo,sub,rows,fmt,o={}){
  rows=rows.slice().sort((a,b)=>(+b.v||0)-(+a.v||0));
  const mx=Math.max(1,...rows.map(r=>Math.max(+r.v||0,+r.meta||0)));
  const leg=o.leg?`<div class="hb-leg xs mut">${o.leg.map(([c,l])=>`<span><i class="${c}"></i>${l}</span>`).join('')}</div>`:'';
  return `<div class="card"><h3>${titulo}</h3>${sub?`<p class="xs mut" style="margin-top:2px">${sub}</p>`:''}${leg}
    <div class="hb">${rows.map(r=>{const v=+r.v||0;const tip=r.nome+': '+fmt(v)+(r.v2!=null?' · '+o.l2+': '+fmt(r.v2):'')+(r.meta?' · meta '+fmt(r.meta)+' ('+pct(v,r.meta)+')':'');
      return `<div class="hb-r" tabindex="0" data-tip="${esc(tip)}"><span class="hb-n sm">${esc(r.nome)}</span><div class="hb-t">${v>0?`<i class="hb-a" style="width:${v/mx*100}%"></i>`:''}${r.v2>0?`<i class="hb-b" style="width:${r.v2/mx*100}%"></i>`:''}${r.meta?`<b class="hb-m" style="left:${Math.min(100,r.meta/mx*100)}%"></b>`:''}</div><span class="hb-v num sm">${fmt(v)}${r.meta?`<span class="xs mut"> ${pct(v,r.meta)}</span>`:''}</span></div>`}).join('')||'<p class="sm mut">Sem dados.</p>'}</div></div>`;
}
function ultimosMeses(n){const out=[];const d=new Date();for(let i=n-1;i>=0;i--){const a=new Date(d.getFullYear(),d.getMonth()-i,1),b=new Date(d.getFullYear(),d.getMonth()-i+1,0);out.push({l:MESES[a.getMonth()],p:[ymd(a),i===0?hoje():ymd(b)]})}return out}
function graficosVend(who,prod){
  const meses=ultimosMeses(6);
  const evol=(ids)=>ids.map(id=>({id,nome:id==='all'?'Equipe':mNome(id),m:meses.map(x=>{const t=metricas(x.p,id);return {l:x.l,rec:t.receita,v:t.vendas,r:t.realiz}})}));
  const mini=(arr,campo,fmt)=>{const mx=Math.max(1,...arr.flatMap(s=>s.m.map(x=>x[campo])));
    return `<div class="sm-grid">${arr.map(s=>{const tot=sum(s.m,x=>x[campo]);return `<div class="sm-c"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b class="sm">${esc(s.nome)}</b><span class="num xs">${fmt(tot)}</span></div><div class="cols">${s.m.map(x=>`<div class="col1" tabindex="0" data-tip="${esc(s.nome+' · '+x.l+': '+fmt(x[campo]))}"><i style="height:${x[campo]/mx*100}%"></i></div>`).join('')}</div><div class="cols-l">${s.m.map(x=>`<span>${x.l}</span>`).join('')}</div></div>`}).join('')}</div>`};
  if(!(S.me==='all'&&who==='all')){
    const s=evol([who]);
    return `<div class="card" style="margin-top:18px"><h3>Sua evolução nos últimos 6 meses</h3><p class="xs mut" style="margin-top:2px">Mesma escala nos três gráficos de cada linha; passe o mouse para ver o valor.</p><div class="grid2" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${[['rec','Receita fechada',money],['v','Vendas',nf],['r','Reuniões realizadas',nf]].map(([c,l,f])=>`<div><span class="eyebrow">${l}</span>${mini(s.map(x=>({...x,nome:''})),c,f)}</div>`).join('')}</div></div>`;
  }
  if(!prod.length)return '';
  const vend=prod.filter(r=>r.x.papel!=='SDR'&&r.x.papel!=='Gestor'||r.mt.receita>0), sdr=prod.filter(r=>r.x.papel==='SDR'||r.mt.tent>0);
  const abertas=[...S.opp.values()].filter(o=>o.status==='aberta');
  const pipe=prod.map(r=>{const os=abertas.filter(o=>o.dono===r.x.id);return {nome:r.x.nome,v:sum(os,o=>o.valor),v2:sum(os,o=>(+o.valor||0)*(+o.prob||0)/100)}}).filter(r=>r.v>0);
  const rateRow=(r,a,b)=>({nome:r.x.nome,v:r.mt[b]?Math.round(r.mt[a]/r.mt[b]*100):0});
  const pctF=v=>v+'%';
  return `<div class="vhead" style="margin:26px 0 12px"><div class="t"><span class="eyebrow">Por vendedor</span><h3 style="font-size:1.25rem">Gráficos da equipe no período</h3><p class="sm mut">Cada gráfico compara as pessoas numa só medida. A marca vertical é a meta do período. Passe o mouse ou toque numa barra para ver os números.</p></div></div>
  <div class="ch-grid">
    ${hbar('Receita fechada','Vendas ganhas no período, contra a meta de receita',(vend.length?vend:prod).map(r=>({nome:r.x.nome,v:r.mt.receita,meta:r.meta.receita})),money)}
    ${hbar('Vendas','Número de contratos ganhos',(vend.length?vend:prod).map(r=>({nome:r.x.nome,v:r.mt.vendas,meta:r.meta.vendas})),nf)}
    ${hbar('Reuniões realizadas','Contra a meta de reuniões',(sdr.length?sdr:prod).map(r=>({nome:r.x.nome,v:r.mt.realiz,meta:r.meta.reunioes})),nf)}
    ${hbar('Tentativas de contato','Ligações, WhatsApp, e-mail e LinkedIn registrados',(sdr.length?sdr:prod).map(r=>({nome:r.x.nome,v:r.mt.tent})),nf)}
    ${hbar('Taxa de contato','Contatos efetivos ÷ tentativas',(sdr.length?sdr:prod).filter(r=>r.mt.tent).map(r=>rateRow(r,'efet','tent')),pctF)}
    ${hbar('Show rate','Reuniões realizadas ÷ (realizadas + no-show)',prod.filter(r=>r.mt.realiz+r.mt.noshow).map(r=>({nome:r.x.nome,v:Math.round(r.mt.realiz/(r.mt.realiz+r.mt.noshow)*100)})),pctF)}
    ${hbar('Pipeline aberto','Hoje, independente do período',pipe,money,{l2:'ponderado',leg:[['hb-a','Valor total'],['hb-b','Ponderado pela probabilidade']]})}
    ${hbar('Win rate','Ganhas ÷ (ganhas + perdidas) no período',prod.filter(r=>r.mt.vendas+r.mt.perdidas.length).map(r=>({nome:r.x.nome,v:Math.round(r.mt.vendas/(r.mt.vendas+r.mt.perdidas.length)*100)})),pctF)}
  </div>
  <div class="card" style="margin-top:14px"><h3>Receita por mês, por vendedor</h3><p class="xs mut" style="margin-top:2px">Últimos 6 meses, todos na mesma escala para comparar. O número ao lado do nome é o total do semestre.</p><div style="margin-top:12px">${mini(evol(prod.filter(r=>r.x.papel!=='SDR').map(r=>r.x.id).concat(prod.every(r=>r.x.papel==='SDR')?prod.map(r=>r.x.id):[])),'rec',money)}</div></div>
  <div class="card" style="margin-top:14px"><h3>Reuniões realizadas por mês, por pessoa</h3><p class="xs mut" style="margin-top:2px">Últimos 6 meses, mesma escala.</p><div style="margin-top:12px">${mini(evol(prod.map(r=>r.x.id)),'r',nf)}</div></div>`;
}

function drOpp(o,tab){

  const tabs=[['resumo','Resumo'],['diagnostico','Diagnóstico'],['proposta','Proposta'],['negociacao','Negociação'],['fechamento','Fechamento']];
  if(o.status==='ganha')tabs.push(['implantacao','Implantação']);

  const ut=ultimoToque(o.empresaId,o.id)||o.atualizadoEm||o.criadoEm, par=diffDays(ut,t), d=o.diag||{}, lp=ultimaProp(o);
  let body='';
  if(tab==='resumo'){
    const av=oppAtvs(o.id);
    body=`${o.status==='aberta'&&par>=(+C.diasParada||7)?`<div class="card" style="border-color:var(--bad)"><b>Parada há ${par} dias.</b> <span class="sm mut">Sem contato registrado desde ${fdate(ut)}.</span></div>`:''}

  }else if(tab==='negociacao'){

    <div class="sec"><h4>Condições, concorrentes e aprovações<span class="row"><button class="btn sm" data-a="negForm" data-id="${o.id}">Editar</button></span></h4><dl class="kv"><dt>Concorrentes na disputa</dt><dd>${esc(o.concorrentes||'—')}</dd><dt>Condições comerciais</dt><dd style="white-space:pre-wrap">${esc(o.condicoes||'—')}</dd><dt>Aprovações</dt><dd>${(o.propostas||[]).filter(p=>p.aprovadoEm).map(p=>'v'+p.v+' aprovada em '+fdate(p.aprovadoEm)).join(' · ')||(lp&&lp.status==='aguardando'?'Desconto aguardando aprovação':'Nenhuma necessária')}</dd></dl></div>
    <div class="row"><button class="btn" data-a="logForm" data-id="${e.id}" data-x="ligacao:${o.id}">Registrar follow-up</button><button class="btn" data-a="taskForm" data-id="${e.id}" data-x="${o.id}">Agendar próximo follow-up</button></div>`;
  }else if(tab==='fechamento'){
    const F=o.fechamento||{};
    body=o.status==='aberta'?`<div class="card"><p>Registre o resultado quando houver decisão. Uma venda ganha cria o checklist de implantação e transforma a empresa em cliente.</p><div class="row" style="margin-top:12px"><button class="btn pri" data-a="winForm" data-id="${o.id}">Ganhamos</button><button class="btn danger" data-a="loseForm" data-id="${o.id}">Perdemos</button></div></div>`
      :`<div class="sec"><h4>${o.status==='ganha'?'Venda ganha':'Venda perdida'}<span class="row"><button class="btn sm" data-a="reopen" data-id="${o.id}">Reabrir</button></span></h4><dl class="kv"><dt>Data</dt><dd>${fdate(F.data)}</dd>${o.status==='ganha'?`<dt>Valor final</dt><dd class="num">${money(F.valorFinal)}</dd><dt>Valor mensal</dt><dd class="num">${money(F.valorMensal)}</dd><dt>Contrato</dt><dd>${esc(F.contrato||'—')}</dd><dt>Vigência</dt><dd>${F.vigencia?F.vigencia+' meses':'—'}</dd>`:`<dt>Motivo</dt><dd>${esc(F.motivo||'—')}</dd><dt>Concorrente vencedor</dt><dd>${esc(F.concorrenteVencedor||'—')}</dd>`}<dt>Ciclo de venda</dt><dd>${diffDays(o.criadoEm,F.data)} dias</dd><dt>Observações</dt><dd>${esc(F.obs||'—')}</dd></dl></div>`;
  }else{
    const h=o.handoff||{},ck=h.checklist||[];
    body=`<div class="sec"><h4>Passagem para a operação ${pill(h.status==='concluido'?'Concluída':h.status==='andamento'?'Em andamento':'Pendente',h.status==='concluido'?'ok':'warn')}</h4>
      <div class="stack" style="gap:6px">${ck.map((x,i)=>`<label class="check"><input type="checkbox" data-a="ckToggle" data-id="${o.id}" data-x="${i}"${x.ok?' checked':''}>${esc(x.t)}</label>`).join('')}</div>
      <label class="fld" style="margin-top:12px"><span>Responsável pela implantação</span><select class="inl" id="dho-${o.id}" data-ch="hoResp" data-id="${o.id}">${membrosOpt(h.responsavel,'A definir')}</select></label>
      <p class="sm" style="margin-top:10px"><span class="mut">Documentação:</span> ${esc(h.docs||'nada registrado')}</p>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-a="hoDocs" data-id="${o.id}">Editar documentação</button>${h.status!=='concluido'?`<button class="btn sm pri" data-a="hoDone" data-id="${o.id}">Concluir passagem</button>`:''}</div></div>`;
  }
  return `<div class="dr-h"><div class="t"><span class="eyebrow">${esc(OPP_TIPOS[o.tipo]||'Oportunidade')}</span><h3>${esc(o.titulo||e.nome)}</h3><div class="row" style="gap:6px"><button class="lnk sm" data-a="emp" data-id="${e.id}">${esc(e.nome)}</button>${o.status==='aberta'?pill(ETAPA_NOME[o.etapa],'info'):o.status==='ganha'?pill('Ganha','ok'):pill('Perdida','bad')}<span class="num sm">${money(o.valor)}</span><span class="sm mut">${o.prob||0}%</span></div></div><button class="x" data-a="close" aria-label="Fechar">×</button></div>
  <div class="subtabs" role="tablist" style="padding:0 14px;margin:0;background:var(--surface)">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-a="oppTab" data-id="${o.id}" data-x="${k}">${l}</button>`).join('')}</div>
  <div class="dr-b">${body}</div>`;
}

/* ============ janelas de formulário ============ */
const F_=(l,html,cls='')=>`<label class="fld ${cls}"><span>${l}</span>${html}</label>`;
const I_=(n,v,t='text',a='')=>`<input id="f-${n}" name="${n}" type="${t}" value="${esc(v??'')}" ${a}>`;
const T_=(n,v,r=3,a='')=>`<textarea id="f-${n}" name="${n}" rows="${r}" ${a}>${esc(v??'')}</textarea>`;
const S_=(n,list,v)=>`<select id="f-${n}" name="${n}">${opt(list,v)}</select>`;
let sheetOpen=null;
function openSheet({title,body,submit='Salvar',onSubmit,onMount,extra=''}){
  const w=$('#sheet');
  w.innerHTML=`<div class="sheet-wrap" data-close="1"><form class="sheet" id="sheetForm" novalidate><div class="sh-h"><h3>${esc(title)}</h3><button class="x" type="button" data-close="1" aria-label="Fechar">×</button></div><div class="sh-b">${body}</div><div class="sh-f">${extra}<button class="btn" type="button" data-close="1">Cancelar</button>${submit?`<button class="btn pri" type="submit">${esc(submit)}</button>`:''}</div></form></div>`;
  const form=$('#sheetForm');sheetOpen={onSubmit};
  form.addEventListener('submit',async ev=>{ev.preventDefault();const fd=Object.fromEntries(new FormData(form));fd._all=new FormData(form);try{const r=await onSubmit(fd,form);if(r!==false)closeSheet()}catch(err){console.error(err);toast('Algo deu errado: '+(err.message||err))}});
  const wrap=w.querySelector('.sheet-wrap');
  wrap.addEventListener('mousedown',ev=>{wrap._down=ev.target===wrap});
  wrap.addEventListener('click',ev=>{if(ev.target===wrap&&wrap._down)closeSheet()});
  form.querySelectorAll('button[data-close]').forEach(b=>b.addEventListener('click',closeSheet));
  if(onMount)onMount(form);
  const f=form.querySelector('input:not([type=hidden]),select,textarea');if(f)setTimeout(()=>f.focus(),30);
}
function closeSheet(){$('#sheet').innerHTML='';sheetOpen=null}

      if(id){await patch('emp',id,base);toast('Empresa atualizada');return}

function quemRegistra(e){return membro(S.me)?S.me:(e.dono||'')}
function formLog(empId,preset){
  const e=S.emp.get(empId);if(!e)return;
  const [canalP,oppId]=String(preset||'').split(':');const ci=cadInfo(e);
  const canal=CANAIS[canalP]?canalP:(ci&&!ci.fim?ci.step.canal:'ligacao');
  const vencido=ci&&!ci.fim&&ci.due<=hoje();
  openSheet({title:'Registrar contato · '+e.nome,body:`<div class="fgrid">
    ${F_('Canal',S_('tipo',[...Object.entries(CANAIS),['nota','Anotação (sem contato)']],canal))}
    ${F_('Com quem',`<input id="f-contato" name="contato" list="dl-cont" value="${esc(contatoPrincipal(e)?.nome||'')}">`)}
    ${F_('Resultado',S_('resultado',Object.entries(RESULT),'sem_resposta'),'full')}
    ${F_('O que aconteceu',T_('notas','',3,'placeholder="Resumo da conversa, objeções, combinados"'),'full')}
    ${ci&&!ci.fim?`<label class="check full"><input type="checkbox" name="avanca" value="1"${vencido?' checked':''}>Conta como o passo ${ci.i+1} da cadência (${CANAIS[ci.step.canal]}: ${esc(ci.step.instrucao)})</label>`:''}
    ${ci&&!ci.fim?`<label class="check full"><input type="checkbox" name="encerra" value="1" id="f-encerra">Encerrar a cadência (já houve conversa)</label>`:''}
    <label class="check full" id="w-desc" hidden><input type="checkbox" name="descartar" value="1">Descartar este lead</label>
    </div><datalist id="dl-cont">${(e.contatos||[]).map(c=>`<option value="${esc(c.nome)}">`).join('')}</datalist>
    ${S.ai?'':''}${cfg().script?`<details><summary class="sm" style="cursor:pointer;color:var(--link)">Ver script de abordagem</summary><p class="sm" style="white-space:pre-wrap;margin-top:6px">${esc(cfg().script)}</p></details>`:''}`,
    onMount:form=>{const r=form.querySelector('#f-resultado'),enc=form.querySelector('#f-encerra'),wd=form.querySelector('#w-desc');
      r.onchange=()=>{const v=r.value;if(enc)enc.checked=v==='contato'||v==='agendou';wd.hidden=v!=='recusa'}},
    onSubmit:async f=>{
      const rec={tipo:f.tipo,empresaId:empId,oppId:oppId||null,contato:f.contato.trim(),resultado:f.tipo==='nota'?'':f.resultado,notas:f.notas.trim(),data:agora(),criadoEm:agora(),dono:quemRegistra(e)};
      if(e.exemplo)rec.exemplo=true;
      novo('atv',rec);
      const up={};
      if(e.status==='novo'&&f.tipo!=='nota')up.status='prospeccao';
      if(ci&&!ci.fim){if(f.encerra)up.cadencia=null;else if(f.avanca)up.cadencia={...cl(e.cadencia),passo:ci.i+1}}
      if(f.descartar){up.status='descartado';up.cadencia=null}
      if(e.status==='cliente'&&e.cliente)up.cliente={ultimoContato:hoje()};
      if(oppId)patch('opp',oppId,{atualizadoEm:agora()});
      if(Object.keys(up).length)await patch('emp',empId,up);
      toast('Contato registrado');
      if(f.resultado==='agendou'&&f.tipo!=='nota')setTimeout(()=>formReuniao(empId,''),80);
    }});
}

function parseCSV(txt){
  txt=txt.replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'';
  const d=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}

document.addEventListener('click',ev=>{
  if(ev.target.closest('#sheet'))return;
  const el=ev.target.closest('[data-a]');if(!el)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'&&!['selOne','selAll','ckToggle'].includes(el.dataset.a))return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.tagName!=='INPUT')ev.preventDefault();
  fn(el.dataset.id,el.dataset.x);
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(sheetOpen)closeSheet();else if(S.drawer){S.drawer=null;render()}}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList?.contains('ocard')){ev.preventDefault();A.opp(ev.target.dataset.id)}
});
let fT=0;
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.closest('#sheet'))return;
  if(t.dataset.f){const [g,k]=t.dataset.f.split('.');S.f[g][k]=t.value;if(g==='merc')S.lim.merc=80;clearTimeout(fT);fT=setTimeout(render,t.type==='search'?180:0);return}
  if(t.dataset.k&&S.draft){
    const ty=t.dataset.t;let v=t.value;
    if(ty==='multi'){const cur=new Set(getPath(S.draft,t.dataset.k)||[]);t.checked?cur.add(t.dataset.v):cur.delete(t.dataset.v);v=[...cur]}
    else if(ty==='num')v=+v||0;else if(ty==='csv')v=csv(v);else if(ty==='lines')v=v.split('\n').map(x=>x.trim()).filter(Boolean);
    setPath(S.draft,t.dataset.k,v);
    if(!S.draftDirty){S.draftDirty=true;const sb=$('#savebar');if(sb)sb.hidden=false}
    if(t.tagName==='SELECT'&&t.dataset.k==='framework')render();
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;if(t.closest('#sheet'))return;
  if(t.id==='me'){S.me=t.value;S.meChosen=true;S.sel.clear();savePrefs();render();return}
  if(t.dataset.f&&t.tagName==='SELECT'){const [g,k]=t.dataset.f.split('.');S.f[g][k]=t.value;render();return}

  drawSide();
  const main=$('#main');
  if(!(S.ready.cfg&&S.ready.emp&&S.ready.atv&&S.ready.opp)){main.innerHTML='<div class="empty"><h3>Carregando os dados da equipe…</h3></div>'}
  else{
    if(S.view==='estrategia'&&!S.draftDirty&&S.draft&&JSON.stringify(S.draftBase)!==JSON.stringify(cfg()))S.draft=null;
    if(S.view==='estrategia'&&!S.draft){S.draft=cl(cfg());S.draftBase=cl(cfg())}
    const V={hoje:vHoje,estrategia:vEstrategia,mercado:vMercado,prospeccao:vProsp,pipeline:vPipeline,clientes:vClientes,gestao:vGestao}[S.view]||vHoje;
    try{main.innerHTML=V()}catch(err){console.error(err);main.innerHTML=`<div class="card empty"><h3>Não consegui montar esta tela</h3><p class="sm">${esc(err.message)}</p></div>`}
  }
  const dw=$('#drawer');
  if(S.drawer){
    const r=S.drawer.type==='emp'?S.emp.get(S.drawer.id):S.opp.get(S.drawer.id);
    if(!r){dw.innerHTML='';S.drawer=null}
    else{try{dw.innerHTML=`<div class="scrim" data-a="close"></div><aside class="drawer" role="dialog" aria-modal="true">${S.drawer.type==='emp'?drEmpresa(r):drOpp(r,S.drawer.tab)}</aside>`;const b=$('#drawer .dr-b');if(b)b.scrollTop=dScroll}catch(err){console.error(err);dw.innerHTML=''}}
  }else dw.innerHTML='';
  if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement){el.focus();if(ss&&el.setSelectionRange)try{el.setSelectionRange(ss[0],ss[1])}catch(e){}}}
}
let rT=0;function render(){if(rT)return;rT=setTimeout(()=>{rT=0;draw()},0)}

/* ============ início ============ */
function startLocal(){
  db=null;S.mode='local';S.canEdit=true;
  const d=lsGet(LKEY);
  if(d){S.cfg=d.cfg||null;S.emp=new Map(d.emp||[]);S.atv=new Map(d.atv||[]);S.opp=new Map(d.opp||[])}
  Object.keys(S.ready).forEach(k=>S.ready[k]=true);fixMe();render();
}
function fixMe(){
  if(S.me!=='all'&&!membro(S.me))S.me='all';
  if(S.me==='all'&&!S.meChosen&&S.email){const m=equipe().find(x=>norm(x.email)===norm(S.email));if(m&&m.papel!=='Gestor'){S.me=m.id;return}}
  if(S.me==='all'&&!S.meChosen&&S.viewerName){const n=norm(S.viewerName);const m=equipe().find(x=>norm(x.nome)===n||norm(x.nome).split(' ')[0]===n.split(' ')[0]);if(m&&m.papel!=='Gestor')S.me=m.id}
}
async function init(){
  const p=lsGet(PKEY);if(p){S.me=p.me||'all';S.meChosen=!!p.me;S.view=p.view||'hoje';S.sub=p.sub||{}}
  if(location.hash&&NAV.some(n=>n[0]===location.hash.slice(1)))S.view=location.hash.slice(1);
  render();
  const c=window.claude;
  if(!c||typeof c.use!=='function'){if(SUPA.url&&SUPA.key&&window.supabase)startWeb();else startLocal();return}
  let d=null,u=null,ai=null;
  try{[d,u,ai]=await Promise.all([c.use('db'),c.use('user'),c.use('sample')])}catch(e){console.error(e)}
  S.ai=ai||null;S.user=u||null;
  if(u){try{S.canEdit=await u.canEdit();const w=await u.can('data.write');if(w===false)S.canWrite=false;const me=await u.me();S.viewerName=me.name||''}catch(e){console.error(e)}}
  if(!d){startLocal();render();return}
  db=d;S.mode='db';
  const onErr=e=>{console.error(e);if(e&&e.code!=='revoked')toast('A conexão com os dados caiu. Recarregue a página.')};
  db.doc('config/geral').onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.ready.cfg=true;fixMe();render()},onErr);
  const sub=(k,q)=>q.onSnapshot(snap=>{const m=new Map();snap.docs.forEach(x=>m.set(x.id,{...x.data(),id:x.id}));S[k]=m;S.ready[k]=true;render()},onErr);
  sub('emp',db.collection('empresas').limit(1000));
  sub('opp',db.collection('oportunidades').limit(1000));
  sub('atv',db.collection('atividades').orderBy('data','desc').limit(1000));
  render();
}

/* ============ versão web (fora do Claude): Supabase com login ============ */
let SB=null;
const KIND={empresas:'emp',atividades:'atv',oportunidades:'opp'};
const sbErr=e=>{console.error(e);return {code:e&&(e.code==='42501'||/row-level security/i.test(e.message||''))?'invalid_argument':'unavailable',message:e&&e.message}};
function aplica(col,id,data){
  if(col==='config'){if(id==='geral'){S.cfg=data?cl(data):null;fixMe()}}
  else{const k=KIND[col];if(!k)return;if(data)S[k].set(id,{...cl(data),id});else S[k].delete(id)}
  render();
}
async function sbUp(col,id,data){const {error}=await SB.from('docs').upsert({colecao:col,id,data,atualizado_em:new Date().toISOString(),atualizado_por:S.email});if(error)throw sbErr(error)}
const sbRef=(col,id)=>({
  set:d=>{aplica(col,id,d);return sbUp(col,id,d)},
  update:d=>{const k=KIND[col],cur=k?S[k].get(id):S.cfg;if(!cur)return Promise.reject({code:'invalid_argument'});const {id:_x,...rest}=cur;const n=merge(cl(rest),cl(d));aplica(col,id,n);return sbUp(col,id,n)},
  delete:()=>{aplica(col,id,null);return SB.from('docs').delete().match({colecao:col,id}).then(r=>{if(r.error)throw sbErr(r.error)})}
});
const sbShim={collection:col=>({doc:id=>sbRef(col,id)}),doc:path=>{const [col,id]=path.split('/');return sbRef(col,id)}};
function telaLogin(modo,msg){
  S.mode='login';document.querySelector('.app').hidden=true;
  let w=$('#auth');if(!w){w=document.createElement('div');w.id='auth';document.body.appendChild(w)}
  const t={entrar:['Entrar','Entrar'],criar:['Criar acesso','Criar acesso'],esqueci:['Recuperar senha','Enviar link'],nova:['Nova senha','Salvar senha'],bloq:['Acesso ainda não liberado','']}[modo];
  w.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--side)"><form id="authForm" class="card" style="width:min(400px,100%);display:flex;flex-direction:column;gap:14px;padding:24px">
    <div class="brand" style="color:var(--brand);padding:0"><svg viewBox="0 0 64 64" aria-hidden="true" fill="currentColor"><rect x="3" y="34" width="11" height="26" rx="4"/><rect x="18" y="25" width="11" height="35" rx="4"/><path d="M33 60V24h-4.6a1.6 1.6 0 0 1-1.3-2.6L38.7 6.4a1.6 1.6 0 0 1 2.6 0l11.6 15a1.6 1.6 0 0 1-1.3 2.6H47v32a4 4 0 0 1-4 4h-6a4 4 0 0 1-4-4z"/></svg><div class="wm"><b>RESULT</b><span>SALES</span></div></div>
    <div><span class="eyebrow">Força de vendas</span><h2>${t[0]}</h2></div>
    ${msg?`<p class="sm" style="background:var(--info-soft);color:var(--info);padding:10px 12px;border-radius:8px">${esc(msg)}</p>`:''}
    ${modo==='bloq'?`<p class="sm">Você entrou como <b>${esc(S.email)}</b>, mas esse e-mail ainda não está na equipe. Peça ao gestor para cadastrar seu e-mail em Estratégia › Equipe.</p><button class="btn" type="button" id="aSair">Sair e usar outro e-mail</button>`:`
    ${modo!=='nova'?`<label class="fld"><span>E-mail</span><input id="aEmail" type="email" autocomplete="email" required style="padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"></label>`:''}
    ${modo==='entrar'||modo==='criar'||modo==='nova'?`<label class="fld"><span>${modo==='entrar'?'Senha':'Crie uma senha (mínimo 8 caracteres)'}</span><input id="aPass" type="password" autocomplete="${modo==='entrar'?'current-password':'new-password'}" minlength="${modo==='entrar'?1:8}" required style="padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"></label>`:''}
    <button class="btn pri" type="submit" style="justify-content:center;padding:10px">${t[1]}</button>
    <div class="row sm" style="justify-content:space-between">${modo==='entrar'?'<button class="btn ghost sm" type="button" data-m="criar">Primeiro acesso</button><button class="btn ghost sm" type="button" data-m="esqueci">Esqueci a senha</button>':modo==='nova'?'':'<button class="btn ghost sm" type="button" data-m="entrar">Já tenho senha</button>'}</div>`}
  </form></div>`;
  w.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>telaLogin(b.dataset.m));
  const sair=w.querySelector('#aSair');if(sair)sair.onclick=async()=>{await SB.auth.signOut();telaLogin('entrar')};
  const f=w.querySelector('#authForm');
  f.onsubmit=async ev=>{ev.preventDefault();if(modo==='bloq')return;const em=(w.querySelector('#aEmail')?.value||'').trim().toLowerCase(),pw=w.querySelector('#aPass')?.value||'';
    const btn=f.querySelector('button[type=submit]');btn.disabled=true;
    const back=location.origin+location.pathname;let r;
    try{
      if(modo==='entrar'){r=await SB.auth.signInWithPassword({email:em,password:pw});if(r.error)return telaLogin('entrar',/confirm/i.test(r.error.message)?'Confirme seu e-mail pelo link que enviamos antes de entrar.':'E-mail ou senha incorretos.')}
      if(modo==='criar'){r=await SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:back}});if(r.error)return telaLogin('criar',/registered|already/i.test(r.error.message)?'Esse e-mail já tem acesso. Use "Já tenho senha".':'Não consegui criar: '+r.error.message);if(!r.data.session)return telaLogin('entrar','Enviamos um link de confirmação para '+em+'. Clique nele e depois entre aqui.')}
      if(modo==='esqueci'){r=await SB.auth.resetPasswordForEmail(em,{redirectTo:back});return telaLogin('entrar',r.error?'Não consegui enviar: '+r.error.message:'Se o e-mail estiver cadastrado, chega um link para criar nova senha.')}
      if(modo==='nova'){r=await SB.auth.updateUser({password:pw});if(r.error)return telaLogin('nova','Não consegui salvar: '+r.error.message);S.recovery=false;return entrouWeb()}
    }finally{btn.disabled=false}
  };
  setTimeout(()=>w.querySelector('input')?.focus(),30);
}
async function entrouWeb(){
  if(S.entrando)return;S.entrando=true;try{return await entrouWeb_()}finally{S.entrando=false}
}
async function entrouWeb_(){
  const {data:{session}}=await SB.auth.getSession();if(!session)return telaLogin('entrar');
  if(S.recovery)return telaLogin('nova');
  S.email=(session.user.email||'').toLowerCase();
  const {data:mb,error}=await SB.from('membros').select('email,nome,papel').eq('email',S.email).maybeSingle();
  if(error){console.error(error);return telaLogin('entrar','Não consegui verificar seu acesso agora. Tente de novo.')}
  if(!mb)return telaLogin('bloq');
  S.papelWeb=mb.papel;S.canEdit=mb.papel==='gestor';S.viewerName=mb.nome||'';
  const a=$('#auth');if(a)a.remove();document.querySelector('.app').hidden=false;
  if(S.webOn)return;S.webOn=true;
  db=sbShim;S.mode='web';render();
  SB.channel('docs-todos').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    if(p.eventType==='DELETE'){const o=p.old||{};if(o.colecao)aplica(o.colecao,o.id,null)}else{const n=p.new;if(n&&n.colecao)aplica(n.colecao,n.id,n.data)}
  }).subscribe();
  try{
    let from=0;const all=[];
    for(;;){const {data,error}=await SB.from('docs').select('colecao,id,data').range(from,from+999);if(error)throw error;all.push(...data);if(data.length<1000)break;from+=1000}
    for(const r of all){if(r.colecao==='config'){if(r.id==='geral')S.cfg=r.data}else{const k=KIND[r.colecao];if(k)S[k].set(r.id,{...r.data,id:r.id})}}
    Object.keys(S.ready).forEach(k=>S.ready[k]=true);fixMe();render();
  }catch(e){console.error(e);toast('Não consegui carregar os dados. Recarregue a página.')}
}
async function syncMembros(D){
  if(S.mode!=='web'||!S.canEdit)return;
  const quer=(D.equipe||[]).filter(m=>m.email&&m.email.includes('@')).map(m=>({email:m.email.trim().toLowerCase(),nome:m.nome.trim(),papel:m.papel==='Gestor'?'gestor':'vendedor'}));
  if(quer.length){const {error}=await SB.from('membros').upsert(quer);if(error){console.error(error);toast('A estratégia foi salva, mas não consegui liberar os acessos.');return}}
  const {data}=await SB.from('membros').select('email');
  const fica=new Set(quer.map(q=>q.email));fica.add(S.email);
  const sai=(data||[]).map(r=>r.email).filter(e=>!fica.has(e));
  if(sai.length)await SB.from('membros').delete().in('email',sai);
}
async function sairWeb(){await SB.auth.signOut();location.reload()}
function startWeb(){
  SB=window.supabase.createClient(SUPA.url,SUPA.key);
  SB.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){S.recovery=true;telaLogin('nova')}else if(ev==='SIGNED_IN'&&!S.webOn&&!S.recovery)entrouWeb()});
  entrouWeb();
}
init();
})();
</script>
